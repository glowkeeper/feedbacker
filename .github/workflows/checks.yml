name: Checks

# Every pull request, and every push to main, runs the project's checks. Nothing here contacts the AI: the checks use
# only synthetic material, and a stand-in for the provider. The checks against the real AI stay manual
# (ui/scripts/manual-reading.ts), run only on the maintainer's go-ahead. The browser checks (the app in Chrome with
# every screen's accessibility audit, and the website's audit) are run before each pull request instead, normally,
# with Chrome slowed (SLOW=4) and with a wide font (WIDE=1): in CI they cost more time than they saved.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - name: Tests
        run: uv run pytest -q
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Contract (the Python reference's outputs are current)
        run: uv run python -m feedbacker_core.contract --check

  proxy:
    name: Proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Types
        run: npm run typecheck

  app:
    name: App, contract, interop and parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            ui/tools/svelte-check/package-lock.json
            proxy/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - name: Install
        run: |
          npm ci
          (cd tools/svelte-check && npm ci)
          (cd ../proxy && npm ci)
      - name: Tests
        run: npm test
      - name: Types and Svelte components
        run: npm run typecheck && npm run check:svelte
      - name: Contract (the schema is current, and agrees with the Python reference)
        run: npm run contract:check
      - name: Interop and parity with the Python core
        run: |
          npm run interop
          npm run parity:extraction
          npm run parity:rubric
          npm run parity:anonymise
          npm run parity:marking

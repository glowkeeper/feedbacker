name: Child deliverable
description: Define one independently deliverable contribution to a parent outcome.
title: ""
body:
  - type: markdown
    attributes:
      value: |-
        This repository is public. Never include student work, marks, feedback,
        names or other personal data, confidential assessment material, credentials,
        or vulnerability details. Describe sensitive material generically or use
        synthetic examples.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the independently deliverable change.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Explain why this exists and the relevant stage constraints.
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent outcome
      description: Link the parent and set GitHub's parent relationship before Ready.
      placeholder: "#123 or issue URL"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions distinguishing completion.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Explain how the acceptance criteria will be checked.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List blocking issues or decisions, or write None.
    validations:
      required: true
  - type: checkboxes
    id: structure
    attributes:
      label: Independent-deliverable check
      options:
        - label: This can be completed and reviewed independently and leaves the repository coherent.
          required: true
        - label: This issue will not have child issues of its own.
          required: true
